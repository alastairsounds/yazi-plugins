# A TOML linter such as https://github.com/tombi-toml/tombi can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
# #:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
sort_by        = 'natural'
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = 'size_and_mtime'
show_hidden    = true
show_symlink   = true

[plugin]
prepend_previewers = [
  { url  = '*.md',        run = 'piper -- leaf --inline ansi:$w "$1"' }, # `npm install -g @rivolink/leaf`
  { url  = '**/justfile', run = 'piper -- just --list --list-prefix="" --list-heading="" --color=always' }, # `brew install just`
]
prepend_fetchers = [
  { url = '*',  run = 'count-todos', group = 'count-todos' },
  { url = '*/', run = 'count-todos', group = 'count-todos' },
]
